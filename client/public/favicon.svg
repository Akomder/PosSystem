<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <!-- Navy background -->
  <rect width="100" height="80" rx="6" fill="#0a1628"/>

  <!-- ── Top bar ── -->
  <!-- Cyan glow strip (behind bar) -->
  <polygon points="18,18 88,18 88,23 22,23" fill="#00e5ff" opacity="0.85"/>
  <!-- Silver bar -->
  <defs>
    <linearGradient id="sg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#d8dde6"/>
      <stop offset="40%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8a9099"/>
    </linearGradient>
    <linearGradient id="sg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#d8dde6"/>
      <stop offset="40%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8a9099"/>
    </linearGradient>
    <linearGradient id="sg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#d8dde6"/>
      <stop offset="40%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8a9099"/>
    </linearGradient>
  </defs>
  <polygon points="12,10 88,10 88,18 18,18 22,14" fill="url(#sg1)"/>
  <!-- Left spike / diagonal cut -->
  <polygon points="10,10 18,10 14,14 10,18 6,14" fill="#00e5ff" opacity="0.9"/>

  <!-- ── Middle bar ── -->
  <!-- Cyan glow strip -->
  <polygon points="18,42 88,42 88,47 22,47" fill="#00e5ff" opacity="0.85"/>
  <!-- Silver bar -->
  <polygon points="14,34 88,34 88,42 18,42 22,38" fill="url(#sg2)"/>
  <!-- Left spike -->
  <polygon points="10,34 18,34 14,38 10,42 6,38" fill="#00e5ff" opacity="0.9"/>

  <!-- ── Bottom bar ── -->
  <!-- Cyan glow strip -->
  <polygon points="16,66 88,66 88,71 20,71" fill="#00e5ff" opacity="0.85"/>
  <!-- Silver bar -->
  <polygon points="10,58 88,58 88,66 16,66 20,62" fill="url(#sg3)"/>
  <!-- Left spike -->
  <polygon points="6,58 16,58 12,62 8,66 4,62" fill="#00e5ff" opacity="0.9"/>
</svg>
